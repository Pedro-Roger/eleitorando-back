services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eleitorando
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eleitorando}
      POSTGRES_DB: eleitorando
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleitorando -d eleitorando"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eleitorando:${POSTGRES_PASSWORD:-eleitorando}@db:5432/eleitorando?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      OCR_SERVICE_URL: http://ocr-service:8081
      PORT: 3333
    ports:
      - "3333:3333"
    volumes:
      - api_uploads:/app/uploads

  # Serviço de OCR (EasyOCR + fallback IA). Requer o repo eleitorando-ocr
  # clonado ao lado deste: ../eleitorando-ocr
  ocr-service:
    build: ../eleitorando-ocr
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: postgresql://eleitorando:${POSTGRES_PASSWORD:-eleitorando}@db:5432/eleitorando
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ocr_models:/root/.EasyOCR

volumes:
  db_data:
  api_uploads:
  ocr_models:
